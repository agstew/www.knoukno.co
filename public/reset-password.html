<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Choose a new password | Kno U Kno</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/app.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="/">Kno U Kno</a>
      <nav aria-label="Main navigation"><a href="/login">Log in</a></nav>
    </header>
    <main class="card">
      <p class="eyebrow">Account help</p>
      <h1>Choose a new password</h1>
      <form id="reset-password-form">
        <label>New password<input name="password" type="password" autocomplete="new-password" minlength="12" required></label>
        <button class="button" type="submit">Update password</button>
        <p id="form-message" class="message" aria-live="polite"></p>
      </form>
    </main>
  </body>
</html>
