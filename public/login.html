<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Log in | Kno U Kno</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/app.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="/">Kno U Kno</a>
      <nav aria-label="Main navigation"><a href="/register">Create account</a></nav>
    </header>
    <main class="card">
      <p class="eyebrow">Welcome back</p>
      <h1>Log in to your account</h1>
      <form id="login-form">
        <label>Email<input name="email" type="email" autocomplete="email" required maxlength="254"></label>
        <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
        <button class="button" type="submit">Log in</button>
        <p id="form-message" class="message" aria-live="polite"></p>
      </form>
      <p><a href="/forgot-password">Forgot your password?</a></p>
      <details>
        <summary>Need another verification email?</summary>
        <form id="resend-verification-form">
          <label>Email<input name="email" type="email" autocomplete="email" required maxlength="254"></label>
          <button class="button button-secondary" type="submit">Resend verification</button>
          <p id="resend-message" class="message" aria-live="polite"></p>
        </form>
      </details>
      <p>New here? <a href="/register">Create an account</a></p>
    </main>
  </body>
</html>
