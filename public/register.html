<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create account | Kno U Kno</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/app.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="/">Kno U Kno</a>
      <nav aria-label="Main navigation"><a href="/login">Log in</a></nav>
    </header>
    <main class="card">
      <p class="eyebrow">Get started</p>
      <h1>Create your account</h1>
      <form id="register-form">
        <label>Full name<input name="name" type="text" autocomplete="name" required maxlength="100"></label>
        <label>Email<input name="email" type="email" autocomplete="email" required maxlength="254"></label>
        <label>Password<input name="password" type="password" autocomplete="new-password" minlength="12" required aria-describedby="password-help"></label>
        <small id="password-help">Use at least 12 characters. Passwords are limited to 72 UTF-8 bytes.</small>
        <button class="button" type="submit">Create account</button>
        <p id="form-message" class="message" aria-live="polite"></p>
      </form>
      <p>Already have an account? <a href="/login">Log in</a></p>
    </main>
  </body>
</html>
